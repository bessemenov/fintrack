<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Giriş Yap</title>
</head>
<body>
  <h2>Giriş Yap</h2>

  <input id="email" placeholder="Email" />
  <br><br>
  <input id="password" type="password" placeholder="Şifre" />
  <br><br>
  <button onclick="login()">Giriş Yap</button>

  <p>Hesabınız yok mu? <a href="register.html">Kayıt Ol</a></p>

  <script>
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Lütfen tüm alanları doldurun.");
        return;
      }

      const body = { email, password };

      fetch("http://localhost:8080/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      })
      .then(res => {
        if (!res.ok) throw new Error("Giriş başarısız. Bilgilerinizi kontrol edin.");
        return res.text(); // Dönüş: Bearer xxxxxxxx
      })
      .then(token => {
        localStorage.setItem("token", token); // frontend tokenı saklar
        window.location.href = "dashboard.html";
      })
      .catch(err => alert("Hata: " + err.message));
    }
  </script>
</body>
</html>
